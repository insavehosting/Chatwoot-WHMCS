<!doctype html>
<html>
<head><meta charset="utf-8"><title>fake Chatwoot dashboard</title></head>
<body>
<!-- Stand-in for Chatwoot's Dashboard App frame (Frame.vue, v4.19.1): sends
     the context as a JSON string on iframe load and on
     'chatwoot-dashboard-app:fetch-info' from that iframe. -->
<iframe id="dashboard-app--frame-0-0" style="display: block; width: 640px; height: 900px; border: 0"></iframe>
<script>
  var params = new URLSearchParams(location.search);
  // What Chatwoot 4.19.1 has under the iframe: the conversation pane,
  // bg-n-surface-1, light and dark
  document.body.style.margin = '0';
  document.body.style.background = params.get('theme') === 'dark' ? 'rgb(20 21 23)' : 'rgb(254 254 254)';
  if (params.get('width')) document.getElementById('dashboard-app--frame-0-0').style.width = params.get('width') + 'px';
  var contact = JSON.parse(params.get('contact') || 'null');
  var frame = document.getElementById('dashboard-app--frame-0-0');
  window.__fetchInfo = 0;
  // The open conversation, as Chatwoot's store has it (currentChat): the
  // display id as `id`, the team in meta.team, the loaded messages and
  // allMessagesLoaded. Tests replace it with __setConversation, as when the
  // agent scrolls up and Chatwoot loads older messages (no context is sent
  // until the app asks for it).
  var conversation = JSON.parse(params.get('conversation') || 'null') || { id: 7, messages: [] };
  window.__setConversation = function (next) { conversation = next; };

  function send() {
    frame.contentWindow.postMessage(JSON.stringify({
      event: 'appContext',
      data: {
        conversation: Object.assign({}, conversation, { meta: Object.assign({}, conversation.meta || {}, { sender: contact }) }),
        contact: contact,
        currentAgent: { id: 1, name: 'Agent', email: 'agent@example.test' },
        customAttributes: [],
        theme: params.get('theme') || 'light'
      }
    }), '*');
  }

  window.addEventListener('message', function (event) {
    if (event.source === frame.contentWindow && event.data === 'chatwoot-dashboard-app:fetch-info') {
      window.__fetchInfo++;
      send();
    }
  });
  frame.addEventListener('load', send);
  frame.src = params.get('app');
</script>
</body>
</html>
